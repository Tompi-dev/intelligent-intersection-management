<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" style="max-width:100%;height:auto;display:block"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DDD8CE"/></pattern></defs><rect x="0" y="0" width="1600" height="1080" rx="0" fill="#F8F6F1"/><rect x="0" y="0" width="222" height="1080" rx="0" fill="#EFECE5"/><rect x="25" y="28" width="34" height="34" rx="10" fill="#B76549"/><text x="42" y="51" font-family="Arial,sans-serif" font-size="25" fill="#FFFFFF" font-weight="600" text-anchor="middle">i</text><text x="70" y="44" font-family="Arial,sans-serif" font-size="18" fill="#302F2B" font-weight="600" text-anchor="start">intersection</text><text x="70" y="62" font-family="Arial,sans-serif" font-size="8" fill="#858078" font-weight="600" text-anchor="start">RESEARCH WORKSPACE</text><rect x="24" y="99" width="173" height="29" rx="7" fill="#E6E1D8"/><text x="36" y="118" font-family="Arial,sans-serif" font-size="10" fill="#858078" font-weight="600" text-anchor="start">DIPLOMA PROJECT  /  2026</text><a href="01-configuration.svg"><rect x="13" y="140" width="196" height="43" rx="10" fill="#FFFFFF"/><rect x="13" y="148" width="3" height="27" rx="2" fill="#B76549"/><text x="30" y="166" font-family="Arial,sans-serif" font-size="11" fill="#B76549" font-weight="600" text-anchor="start">01</text><text x="57" y="166" font-family="Arial,sans-serif" font-size="13" fill="#302F2B" font-weight="600" text-anchor="start">Run configuration</text></a><a href="02-monitor.svg"><text x="30" y="218" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="600" text-anchor="start">02</text><text x="57" y="218" font-family="Arial,sans-serif" font-size="13" fill="#858078" font-weight="400" text-anchor="start">Intersection monitor</text></a><a href="03-comparison.svg"><text x="30" y="270" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="600" text-anchor="start">03</text><text x="57" y="270" font-family="Arial,sans-serif" font-size="13" fill="#858078" font-weight="400" text-anchor="start">Experiment results</text></a><text x="28" y="373" font-family="Arial,sans-serif" font-size="10" fill="#858078" font-weight="600" text-anchor="start">PROJECT RESOURCES</text><a href="https://github.com/Tompi-dev/intelligent-intersection-management" target="_blank"><text x="30" y="410" font-family="Arial,sans-serif" font-size="13" fill="#302F2B" font-weight="400" text-anchor="start">Repository ↗</text></a><a href="https://tomiris.youtrack.cloud/projects/IIM/issues" target="_blank"><text x="30" y="448" font-family="Arial,sans-serif" font-size="13" fill="#302F2B" font-weight="400" text-anchor="start">Task board ↗</text></a><rect x="20" y="855" width="182" height="105" rx="12" fill="#E7E2D8"/><text x="35" y="880" font-family="Arial,sans-serif" font-size="12" fill="#302F2B" font-weight="600" text-anchor="start">Research environment</text><text x="35" y="903" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">One junction · two phases</text><text x="35" y="925" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">No public-road actuation</text><text x="35" y="945" font-family="Arial,sans-serif" font-size="10" fill="#B76549" font-weight="600" text-anchor="start">Static interface prototype</text><circle cx="41" cy="1004" r="16" fill="#DCD3C7"/><text x="41" y="1008" font-family="Arial,sans-serif" font-size="10" fill="#302F2B" font-weight="600" text-anchor="middle">TK</text><text x="67" y="1001" font-family="Arial,sans-serif" font-size="11" fill="#302F2B" font-weight="600" text-anchor="start">Tomiris Kassymova</text><text x="67" y="1019" font-family="Arial,sans-serif" font-size="10" fill="#858078" font-weight="400" text-anchor="start">Controller &amp; integration</text><text x="260" y="43" font-family="Arial,sans-serif" font-size="10" fill="#858078" font-weight="600" text-anchor="start">WORKSPACE   /   SINGLE INTERSECTION</text><rect x="1280" y="25" width="147" height="29" rx="7" fill="#EFE8DE"/><text x="1292" y="44" font-family="Arial,sans-serif" font-size="10" fill="#B76549" font-weight="600" text-anchor="start">DESIGN PROTOTYPE</text><text x="1525" y="44" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">v0.2</text><line x1="250" y1="68" x2="1560" y2="68" stroke="#E7E2D9"/><text x="260" y="118" font-family="Georgia,serif" font-size="34" fill="#302F2B" font-weight="400" text-anchor="start">Set the conditions. Keep control.</text><text x="260" y="148" font-family="Arial,sans-serif" font-size="13" fill="#858078" font-weight="400" text-anchor="start">Run configuration  /  Reproducible research starts with a declared setup</text><rect x="260" y="176" width="1298" height="29" rx="7" fill="#F1E9DD"/><text x="272" y="195" font-family="Arial,sans-serif" font-size="11" fill="#8C6745" font-weight="600" text-anchor="start">DEMONSTRATION DATA · Layout and values illustrate intended behaviour. No camera inference or measured traffic improvement.</text><text x="261" y="1055" font-family="Arial,sans-serif" font-size="10" fill="#858078" font-weight="600" text-anchor="start">INTERSECTION LAB</text><text x="1560" y="1055" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="end">Academic prototype · 24 October 2026</text><rect x="260" y="232" width="802" height="345" rx="15" fill="#FFFFFF" stroke="#E7E2D9"/><text x="282" y="263" font-family="Arial,sans-serif" font-size="14" fill="#302F2B" font-weight="600" text-anchor="start">01  Experiment identity</text><text x="282" y="284" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">Settings shown here describe the proposed workflow; controls are static.</text><text x="283" y="322" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="600" text-anchor="start">RUN NAME</text><rect x="283" y="334" width="360" height="44" rx="8" fill="#FAF9F6" stroke="#E7E2D9"/><text x="296" y="361" font-family="Arial,sans-serif" font-size="13" fill="#302F2B" font-weight="400" text-anchor="start">example-run</text><text x="677" y="322" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="600" text-anchor="start">SOURCE TYPE</text><rect x="677" y="334" width="360" height="44" rx="8" fill="#FAF9F6" stroke="#E7E2D9"/><text x="690" y="361" font-family="Arial,sans-serif" font-size="13" fill="#302F2B" font-weight="400" text-anchor="start">Precomputed queue observations</text><text x="283" y="416" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="600" text-anchor="start">INPUT FIXTURE</text><rect x="283" y="428" width="754" height="44" rx="8" fill="#FAF9F6" stroke="#E7E2D9"/><text x="296" y="455" font-family="Arial,sans-serif" font-size="13" fill="#302F2B" font-weight="400" text-anchor="start">prototype/sample_observations.json</text><text x="283" y="491" font-family="Arial,sans-serif" font-size="10" fill="#858078" font-weight="400" text-anchor="start">11 timestamped rows · N / S / E / W · synthetic counts</text><rect x="283" y="522" width="754" height="29" rx="7" fill="#EAF0E9"/><text x="295" y="541" font-family="Arial,sans-serif" font-size="10" fill="#467764" font-weight="600" text-anchor="start">CURRENT IMPLEMENTATION: Python CLI + JSON. Camera and SUMO adapters are planned.</text><rect x="260" y="597" width="802" height="425" rx="15" fill="#FFFFFF" stroke="#E7E2D9"/><text x="282" y="628" font-family="Arial,sans-serif" font-size="14" fill="#302F2B" font-weight="600" text-anchor="start">02  Timing &amp; transition guard</text><text x="282" y="649" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">Toy experiment parameters · not certified settings for a real road</text><text x="283" y="688" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="600" text-anchor="start">MINIMUM GREEN</text><rect x="283" y="700" width="360" height="44" rx="8" fill="#FAF9F6" stroke="#E7E2D9"/><text x="296" y="727" font-family="Arial,sans-serif" font-size="13" fill="#302F2B" font-weight="400" text-anchor="start">10 seconds</text><text x="283" y="763" font-family="Arial,sans-serif" font-size="10" fill="#858078" font-weight="400" text-anchor="start">Do not switch before minimum</text><text x="677" y="688" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="600" text-anchor="start">MAXIMUM GREEN</text><rect x="677" y="700" width="360" height="44" rx="8" fill="#FAF9F6" stroke="#E7E2D9"/><text x="690" y="727" font-family="Arial,sans-serif" font-size="13" fill="#302F2B" font-weight="400" text-anchor="start">45 seconds</text><text x="677" y="763" font-family="Arial,sans-serif" font-size="10" fill="#858078" font-weight="400" text-anchor="start">Force opposing service</text><text x="283" y="790" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="600" text-anchor="start">YELLOW</text><rect x="283" y="802" width="360" height="44" rx="8" fill="#FAF9F6" stroke="#E7E2D9"/><text x="296" y="829" font-family="Arial,sans-serif" font-size="13" fill="#302F2B" font-weight="400" text-anchor="start">3 seconds</text><text x="283" y="865" font-family="Arial,sans-serif" font-size="10" fill="#858078" font-weight="400" text-anchor="start">Mandatory clearance</text><text x="677" y="790" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="600" text-anchor="start">ALL-RED</text><rect x="677" y="802" width="360" height="44" rx="8" fill="#FAF9F6" stroke="#E7E2D9"/><text x="690" y="829" font-family="Arial,sans-serif" font-size="13" fill="#302F2B" font-weight="400" text-anchor="start">2 seconds</text><text x="677" y="865" font-family="Arial,sans-serif" font-size="10" fill="#858078" font-weight="400" text-anchor="start">No green during clearance</text><text x="283" y="892" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="600" text-anchor="start">FIXED FALLBACK GREEN</text><rect x="283" y="904" width="360" height="44" rx="8" fill="#FAF9F6" stroke="#E7E2D9"/><text x="296" y="931" font-family="Arial,sans-serif" font-size="13" fill="#302F2B" font-weight="400" text-anchor="start">20 seconds</text><text x="283" y="967" font-family="Arial,sans-serif" font-size="10" fill="#858078" font-weight="400" text-anchor="start">Used with missing / stale input</text><text x="677" y="892" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="600" text-anchor="start">QUEUE HYSTERESIS</text><rect x="677" y="904" width="360" height="44" rx="8" fill="#FAF9F6" stroke="#E7E2D9"/><text x="690" y="931" font-family="Arial,sans-serif" font-size="13" fill="#302F2B" font-weight="400" text-anchor="start">2 vehicles</text><text x="677" y="967" font-family="Arial,sans-serif" font-size="10" fill="#858078" font-weight="400" text-anchor="start">Reduce unnecessary switching</text><rect x="1082" y="232" width="478" height="534" rx="15" fill="#FFFFFF" stroke="#E7E2D9"/><text x="1104" y="263" font-family="Arial,sans-serif" font-size="14" fill="#302F2B" font-weight="600" text-anchor="start">Run manifest preview</text><text x="1104" y="284" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">What should be preserved with a reproducible run</text><text x="1105" y="326" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">Geometry</text><text x="1537" y="326" font-family="Arial,sans-serif" font-size="11" fill="#302F2B" font-weight="600" text-anchor="end">One four-arm junction</text><line x1="1104" y1="341" x2="1538" y2="341" stroke="#E7E2D9"/><text x="1105" y="375" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">Movements</text><text x="1537" y="375" font-family="Arial,sans-serif" font-size="11" fill="#302F2B" font-weight="600" text-anchor="end">Through-only · NS / EW</text><line x1="1104" y1="390" x2="1538" y2="390" stroke="#E7E2D9"/><text x="1105" y="424" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">Controller</text><text x="1537" y="424" font-family="Arial,sans-serif" font-size="11" fill="#302F2B" font-weight="600" text-anchor="end">Constrained queue heuristic</text><line x1="1104" y1="439" x2="1538" y2="439" stroke="#E7E2D9"/><text x="1105" y="473" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">Input version</text><text x="1537" y="473" font-family="Arial,sans-serif" font-size="11" fill="#302F2B" font-weight="600" text-anchor="end">Checked-in sample fixture</text><line x1="1104" y1="488" x2="1538" y2="488" stroke="#E7E2D9"/><text x="1105" y="522" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">Source freshness</text><text x="1537" y="522" font-family="Arial,sans-serif" font-size="11" fill="#302F2B" font-weight="600" text-anchor="end">Stale after 2 seconds</text><line x1="1104" y1="537" x2="1538" y2="537" stroke="#E7E2D9"/><text x="1105" y="571" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">Output</text><text x="1537" y="571" font-family="Arial,sans-serif" font-size="11" fill="#302F2B" font-weight="600" text-anchor="end">Stage, group, mode, reason</text><line x1="1104" y1="586" x2="1538" y2="586" stroke="#E7E2D9"/><text x="1105" y="620" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">Random seed</text><text x="1537" y="620" font-family="Arial,sans-serif" font-size="11" fill="#302F2B" font-weight="600" text-anchor="end">Not used by this fixture</text><line x1="1104" y1="635" x2="1538" y2="635" stroke="#E7E2D9"/><text x="1105" y="669" font-family="Arial,sans-serif" font-size="11" fill="#858078" font-weight="400" text-anchor="start">Video / model</text><text x="1537" y="669" font-family="Arial,sans-serif" font-size="11" fill="#302F2B" font-weight="600" text-anchor="end">Not integrated</text><line x1="1104" y1="684" x2="1538" y2="684" stroke="#E7E2D9"/><rect x="1082" y="786" width="478" height="236" rx="15" fill="#FFFFFF" stroke="#E7E2D9"/><text x="1104" y="817" font-family="Arial,sans-serif" font-size="14" fill="#302F2B" font-weight="600" text-anchor="start">Ready for a local demonstration</text><text x="1106" y="850" font-family="Arial,sans-serif" font-size="12" fill="#302F2B" font-weight="400" text-anchor="start">1   Run ./run_demo.command in the project folder</text><text x="1106" y="887" font-family="Arial,sans-serif" font-size="12" fill="#302F2B" font-weight="400" text-anchor="start">2   Review tests and controller output in the terminal</text><text x="1106" y="924" font-family="Arial,sans-serif" font-size="12" fill="#302F2B" font-weight="400" text-anchor="start">3   Open the monitoring mockup to explain the design</text><a href="02-monitor.svg"><rect x="1106" y="956" width="429" height="43" rx="8" fill="#B76549"/><text x="1320" y="983" font-family="Arial,sans-serif" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Open monitoring design →</text></a></svg>